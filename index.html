<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Index</title>
    <link rel="stylesheet" href="index.css" onchange="SemSup()">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lol Randomizer</h1>
            <!-- <label for="SupItens">Itens Sup</label>
            <input type="checkbox" name="SupItens" id="SupItens"> -->
        </header>
        
        <section class="champion">
            <img src="json/xama.jpg" alt="Pyke" id="image" class="champion-image">
            <h2 id="name" class="champion-name">Xamã Voodoo</h2>
            <h4 id="frase" class="champion-title">Alguem abandonado</h4>        
        <button onclick="rerollChampion()">Reroll</button>
        </section>

        <section class="items">
            <h3>Itens</h3>
            <div class="items-grid">
                <img src="img/Itens/Item(1).jpg" alt="Item 1" id="Item1">
                <img src="img/Itens/Item(2).jpg" alt="Item 2" id="Item2">
                <img src="img/Itens/Item(3).jpg" alt="Item 3" id="Item3">
                <img src="img/Itens/Item(4).jpg" alt="Item 4" id="Item4">
                <img src="img/Itens/Item(5).jpg" alt="Item 5" id="Item5">
                <img id="bota" src="img/BootsFeiticos/Bota(6).jpg" alt="Item 6" >
            </div>
        </section>
        <section class="Feiticos">
            <h3>Feitiço</h3>
            <div class="feiticos">
                <img src="img/BootsFeiticos/Feitico(1).jpg" alt="Feiticos" id="Feitico" style="border-radius: 50%;" class="Runa">
            </div>
        </section>
        <section class="runas">
            <h3>Runas</h3>
            <div class="runes-grid">
                <img src="img/Runas/Runa(1).jpeg" alt="Rune 1" id="Runa1" style="border-radius: 50%;" class="Runa"><br>
                <img src="img/Runas/Runa(13).jpeg" alt="Rune 2" id="Runa2" style="border-radius: 50%;" class="Runa">
                <img src="img/Runas/Runa(17).jpeg" alt="Rune 3" id="Runa3" style="border-radius: 50%;" class="Runa">
                <img src="img/Runas/Runa(20).jpeg" alt="Rune 4" id="Runa4" style="border-radius: 50%;" class="Runa">
                <img src="img/Runas/Runa(33).jpeg" alt="Rune 5" id="Runa5" style="border-radius: 50%;" class="Runa">
            </div>
        </section>
    </div>
</body>
<script src="machine.js" onload="radomizer()">
</script>
<style>
    
  .Runa{
    width: 10vh;
    height: 10vh;
  }
</style>
</html>
